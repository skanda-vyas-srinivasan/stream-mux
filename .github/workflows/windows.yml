name: Windows

on:
  push:
    branches:
      - main
      - feature/windows-receiver
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-windows -A x64

      - name: Build
        run: cmake --build build-windows --config Release --parallel

      - name: Test portable core
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Smoke-test receiver executable
        run: .\build-windows\windows\Release\soundmux_windows_receiver.exe --help

      - name: Publish receiver executable
        uses: actions/upload-artifact@v4
        with:
          name: soundmux-windows-receiver-${{ github.sha }}
          path: |
            build-windows/windows/Release/soundmux_windows_receiver.exe
            windows/README.md
          if-no-files-found: error
